name: quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@802e89cd7394b98352d79117a8b463bbfc2fdacf
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Validate application
        run: |
          go build ./...
          go vet ./...
          go test -race ./...
          node --test tests/*.test.mjs
      - name: Validate bootstrap and chart
        run: |
          python3 -m pip install -r requirements-dev.txt
          ./saferus tools > "$RUNNER_TEMP/saferus-tools.json"
          export SAFERUS_HELM="$HOME/.cache/saferus/tools/helm-4.3.2"
          "$SAFERUS_HELM" lint charts/saferus
          python3 -m unittest discover -s tests -v
