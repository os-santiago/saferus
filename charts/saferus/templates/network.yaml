apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saferus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {saferus.io/client: allowed}
      ports:
        - {port: 8200, protocol: TCP}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - {port: 8201, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - {port: 8201, protocol: TCP}
    {{- if .Values.network.apiCIDRs }}
    - to:
        {{- range .Values.network.apiCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        - {port: {{ .Values.network.apiPort }}, protocol: TCP}
    {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saferus-client
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-saferus-tokenreview
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-saferus-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-saferus-tokenreview
subjects:
  - kind: ServiceAccount
    name: saferus
    namespace: {{ .Release.Namespace }}
